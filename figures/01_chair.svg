<svg xmlns="http://www.w3.org/2000/svg" width="660" height="490" viewBox="0 0 660 490" role="img" aria-labelledby="title desc">
<title id="title">椅子装配：任务依赖与最终分配</title>
<desc id="desc">箭头从前置任务指向后续任务。节点列出连接部件及匿名机器人编号。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8595a9"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="660" height="490" rx="16" fill="#f5f8fc"/>
<text x="28" y="38" font-size="23" font-weight="600" fill="#17304e">椅子装配</text>
<text x="28" y="67" font-size="14" fill="#53667d">3 个子任务 · 简单串行依赖 · 初始分配通过检验</text>
<path d="M330.0,197 C330.0,216.0 330.0,216.0 330.0,230" fill="none" stroke="#8595a9" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M330.0,313 C330.0,332.0 330.0,332.0 330.0,346" fill="none" stroke="#8595a9" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="233.0" y="119" width="194" height="78" rx="9" fill="#fff" stroke="#c5d3e5"/>
<text x="330.0" y="142" text-anchor="middle" font-size="16" font-weight="600" fill="#17304e">任务1</text>
<text x="330.0" y="165" text-anchor="middle" font-size="14" fill="#53667d">部件0 — 部件1</text>
<text x="330.0" y="185" text-anchor="middle" font-size="13" fill="#245b91">机器人：乙</text>
<rect x="233.0" y="235" width="194" height="78" rx="9" fill="#fff" stroke="#c5d3e5"/>
<text x="330.0" y="258" text-anchor="middle" font-size="16" font-weight="600" fill="#17304e">任务2</text>
<text x="330.0" y="281" text-anchor="middle" font-size="14" fill="#53667d">部件0 — 部件2</text>
<text x="330.0" y="301" text-anchor="middle" font-size="13" fill="#245b91">机器人：乙</text>
<rect x="233.0" y="351" width="194" height="78" rx="9" fill="#fff" stroke="#c5d3e5"/>
<text x="330.0" y="374" text-anchor="middle" font-size="16" font-weight="600" fill="#17304e">任务3</text>
<text x="330.0" y="397" text-anchor="middle" font-size="14" fill="#53667d">部件1 — 部件3</text>
<text x="330.0" y="417" text-anchor="middle" font-size="13" fill="#245b91">机器人：甲</text>
<text x="28" y="472" font-size="12" fill="#64758a">箭头表示任务依赖；图中位置不表示执行时间或机器人轨迹。</text>
</svg>
